[package]
name = "geoclass"
version = "0.1.0"
edition = "2024"
description = "Geo-aware, prompt-cache-sticky egress router for OpenAI capacity errors, meshed over Tailscale"
license = "MIT"
repository = "https://github.com/ghuntley/geoclass"

[dependencies]
axum = "0.8.9"
bytes = "1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
http = "1.5.0"
lru = "0.19"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
hegeltest = "0.49.0"
